version: '3.8'

services:
  cryptconnect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptconnect
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cryptconnect.rule=Host(`cryptconnect.thommen.work`)"
      - "traefik.http.routers.cryptconnect.entrypoints=websecure"
      - "traefik.http.routers.cryptconnect.tls=true"
      - "traefik.http.routers.cryptconnect.tls.certresolver=letsencrypt"
      - "traefik.http.services.cryptconnect.loadbalancer.server.port=80"

networks:
  web:
    external: true
